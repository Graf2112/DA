<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <title>DA Donation Preview</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="https://unpkg.com/98.css@0.1.17/dist/98.min.css" />
  <style>
    :root { --bg-a:#0f5f2f; --bg-b:#1d7d46; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "MS Sans Serif", Tahoma, sans-serif;
      background: radial-gradient(circle at 20% 20%, var(--bg-b), var(--bg-a));
    }
    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      gap: 16px;
    }
    #dock { width: 360px; }
    .window { opacity: 0; transform: translateY(12px); transition: opacity .18s ease, transform .18s ease; }
    .window.show { opacity: 1; transform: translateY(0); }
    #msg { font-size: 14px; line-height: 1.25; white-space: pre-wrap; word-break: break-word; }
    #meta { margin-top: 8px; font-size: 12px; opacity: .85; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  </style>
</head>
<body>
  <main class="stage">
    <div id="dock">
      <div id="alertWin" class="window" style="max-width:360px;">
        <div class="title-bar">
          <div class="title-bar-text" id="title">Donation received</div>
          <div class="title-bar-controls">
            <button aria-label="Minimize" disabled></button>
            <button aria-label="Maximize" disabled></button>
            <button aria-label="Close" id="closeBtn"></button>
          </div>
        </div>
        <div class="window-body">
          <div id="msg"></div>
          <div id="meta"></div>
          <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
            <button id="okBtn">OK</button>
          </div>
        </div>
      </div>
    </div>

    <div class="controls">
      <button id="testBtn">Test Donation</button>
      <button id="longBtn">Test Long Message</button>
    </div>
  </main>

  <script>
    const UI = {
      win: document.getElementById("alertWin"),
      title: document.getElementById("title"),
      msg: document.getElementById("msg"),
      meta: document.getElementById("meta"),
      ok: document.getElementById("okBtn"),
      close: document.getElementById("closeBtn"),
      test: document.getElementById("testBtn"),
      long: document.getElementById("longBtn")
    };

    const queue = [];
    let showing = false;
    let hideTimer = null;

    function escapeText(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function showNext() {
      if (showing || queue.length === 0) return;
      showing = true;

      const a = queue.shift();
      UI.title.textContent = a.title;
      UI.msg.innerHTML = escapeText(a.text);
      UI.meta.textContent = a.meta ?? "";
      UI.win.classList.add("show");

      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideNow, a.durationMs ?? 9000);
    }

    function hideNow() {
      UI.win.classList.remove("show");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        showing = false;
        showNext();
      }, 220);
    }

    function handleDonation(d) {
      const user = d.username || d.name || "Anonymous";
      const amount = `${d.amount ?? ""} ${d.currency ?? ""}`.trim();
      const text = `${user} donated ${amount}\n\n${d.message || ""}`.trim();

      queue.push({
        title: "Donation received",
        text,
        meta: new Date().toLocaleTimeString(),
        durationMs: 9000
      });
      showNext();
    }

    UI.ok.addEventListener("click", hideNow);
    UI.close.addEventListener("click", hideNow);
    UI.test.addEventListener("click", () => {
      handleDonation({ username: "Graf2112", amount: 100, currency: "RUB", message: "Windows 98 moment." });
    });
    UI.long.addEventListener("click", () => {
      handleDonation({
        username: "VeryLongNameSupporter",
        amount: 1337,
        currency: "RUB",
        message: "This is a longer test message to verify wrapping and line breaks in the current donation overlay style."
      });
    });

    handleDonation({ username: "TestUser", amount: 50, currency: "RUB", message: "Preview is ready." });
    window.__test = handleDonation;
  </script>
</body>
</html>
