<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DA Win98 Alerts</title>

  <!-- 98.css -->
  <link rel="stylesheet" href="./98.css" />

  <style>
    body {
      margin: 0;
      background: transparent;
      overflow: hidden;
      font-family: "MS Sans Serif", Tahoma, sans-serif;
    }

    /* Позиция алерта на стриме */
    #dock {
      position: fixed;
      left: 24px;
      bottom: 24px;
      width: 360px;
      pointer-events: none; /* чтобы не мешать кликам в OBS */
    }

    .window {
      pointer-events: auto;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity .18s ease, transform .18s ease;
    }

    .window.show {
      opacity: 1;
      transform: translateY(0);
    }

    #msg {
      font-size: 14px;
      line-height: 1.25;
      white-space: pre-wrap;
      word-break: break-word;
    }

    #meta {
      margin-top: 8px;
      font-size: 12px;
      opacity: .85;
    }

    /* Мелкая “win98” деталь — пиксельная иконка */
    .title-bar-text::before {
      content: "💾 ";
    }
  </style>
</head>

<body>
  <div id="dock">
    <div id="alertWin" class="window" style="max-width: 360px;">
      <div class="title-bar">
        <div class="title-bar-text" id="title">Donation!</div>
        <div class="title-bar-controls">
          <button aria-label="Minimize" disabled></button>
          <button aria-label="Maximize" disabled></button>
          <button aria-label="Close" id="closeBtn"></button>
        </div>
      </div>
      <div class="window-body">
        <div id="msg"></div>
        <div id="meta"></div>
        <div style="margin-top:10px; display:flex; gap:8px; justify-content:flex-end;">
          <button id="okBtn">OK</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const UI = {
      win: document.getElementById("alertWin"),
      title: document.getElementById("title"),
      msg: document.getElementById("msg"),
      meta: document.getElementById("meta"),
      ok: document.getElementById("okBtn"),
      close: document.getElementById("closeBtn"),
    };

    const queue = [];
    let showing = false;
    let hideTimer = null;

    function escapeText(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
      }[c]));
    }

    function showNext() {
      if (showing || queue.length === 0) return;
      showing = true;

      const a = queue.shift();
      UI.title.textContent = a.title;
      UI.msg.innerHTML = escapeText(a.text);
      UI.meta.textContent = a.meta ?? "";

      UI.win.classList.add("show");

      clearTimeout(hideTimer);
      hideTimer = setTimeout(hideNow, a.durationMs ?? 7000);
    }

    function hideNow() {
      UI.win.classList.remove("show");
      clearTimeout(hideTimer);
      hideTimer = setTimeout(() => {
        showing = false;
        showNext();
      }, 220);
    }

    UI.ok.addEventListener("click", hideNow);
    UI.close.addEventListener("click", hideNow);

    // ---- СЮДА ПОДАЁШЬ ДОНАТЫ ИЗ WEBSOCKET ----
    function handleDonation(d) {
      // ожидаем что d: {username, amount, currency, message}
      const user = d.username || "Anonymous";
      const amount = `${d.amount ?? ""} ${d.currency ?? ""}`.trim();
      const text = `${user} donated ${amount}\n\n${d.message || ""}`.trim();

      queue.push({
        title: "Donation received",
        text,
        meta: new Date().toLocaleTimeString(),
        durationMs: 8000
      });
      showNext();
    }

    // Тест без DonationAlerts (удобно для верстки)
    window.__test = () => handleDonation({
      username: "Graf2112",
      amount: 100,
      currency: "RUB",
      message: "Windows 98 moment."
    });

    // Дальше будет подключение к DA (см. следующий раздел).
  </script>
</body>
</html>
